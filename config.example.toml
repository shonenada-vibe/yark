# Copy to ~/.config/yark/config.toml (or ./config.toml).
# Environment variables override these values.

[volcengine]
# New console: API Key from
# https://console.volcengine.com/speech/new/setting/apikeys
api_key = ""

# Legacy console (used only when api_key is empty):
app_key = ""
access_key = ""

# Seed-ASR 2.0 duration (recommended). Alternatives:
#   volc.seedasr.sauc.concurrent
#   volc.bigasr.sauc.duration
#   volc.bigasr.sauc.concurrent
resource_id = "volc.seedasr.sauc.duration"

# Bidirectional streaming (optimized). Other endpoints:
#   wss://openspeech.bytedance.com/api/v3/sauc/bigmodel
#   wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_nostream
endpoint = "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async"

[audio]
sample_rate = 16000
chunk_ms = 200
# Empty uses the system default input device.
device = ""

[input]
# Hold-to-talk shortcut. Record in the menu-bar Settings panel.
# Examples: right_option, f8, command+option
hotkey = "right_option"
# unicode = live keystrokes (Chinese-safe)
# paste   = clipboard Cmd+V per committed phrase
# print   = stdout only (no typing)
inject = "unicode"
beep = true

[stt]
enable_itn = true
enable_punc = true
enable_ddc = true
show_utterances = true
end_window_size = 800
result_type = "single"
